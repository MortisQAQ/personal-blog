name: 部署 GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 解析站点 base 路径
        # 有自定义域名（public/CNAME 存在）→ 站点在根路径 /；否则是项目页子路径 /<repo>/
        # 写进 GITHUB_ENV，避免依赖 Vite 配置里读 process.env（Vite 8 下不可靠）
        run: |
          if [ -f public/CNAME ]; then
            echo "VITE_BASE_URL=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_URL=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建网站
        run: pnpm run build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 GitHub Pages 制品
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
