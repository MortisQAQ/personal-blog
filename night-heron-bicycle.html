    .intro-note { margin: 0 0 3px; font-size: .76rem; line-height: 1.95; color: var(--muted); }
    .intro-note em { display: block; margin-bottom: 5px; font-family: Georgia, serif; font-style: italic; font-size: 1.05rem; color: var(--ink); }
    .scene { position: relative; isolation: isolate; margin: 0; overflow: hidden; border: 1px solid #bcc7b7; border-radius: 18px; background: #c7d4bb; }

    .scene-caption { position: absolute; left: 26px; bottom: 20px; font-size: .63rem; letter-spacing: .12em; color: #74806c; }
    .speech { position: absolute; top: 24%; left: 61%; padding: 9px 17px; border: 1px solid #354b40; border-radius: 16px 16px 16px 3px; background: #faf4df; color: var(--ink); font-size: .82rem; transform: translateY(8px) rotate(-5deg); opacity: 0; transition: opacity .18s, transform .25s; pointer-events: none; }
    .speech.visible { opacity: 1; transform: translateY(0) rotate(-5deg); }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 19px 0; border-bottom: 1px solid var(--line); }
    .ride-status { display: flex; align-items: center; gap: 12px; }
    .status-icon { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; }
    .status-icon svg { width: 16px; height: 16px; }
    .status-title { margin: 0 0 4px; font-size: .74rem; font-weight: 550; }
    .status-sub { font-family: ui-monospace, Consolas, monospace; font-size: .6rem; letter-spacing: .06em; color: var(--muted); }
    .actions { display: flex; align-items: center; gap: 8px; }
    .control { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; border: 1px solid var(--line); border-radius: 24px; padding: 0 17px; background: transparent; color: var(--ink); cursor: pointer; font-size: .73rem; white-space: nowrap; transition: background .18s, border-color .18s, transform .18s; }
    .control:hover { background: #e7eadd; border-color: #a7b5a4; }
    .control:active { transform: scale(.96); }
    .control svg { width: 15px; height: 15px; flex-shrink: 0; }
    .control.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .control.primary:hover { background: #3e584b; }
    .pause-icon, .play-icon { display: none; }
    .page[data-playing="true"] .pause-icon, .page[data-playing="false"] .play-icon { display: block; }
    .footnote { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-top: 19px; color: var(--muted); font-size: .65rem; line-height: 1.65; }
    .species { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

    .signature { font-family: ui-monospace, Consolas, monospace; font-size: .59rem; letter-spacing: .09em; }

      .scene { border-radius: 14px; }
      .scene-svg { aspect-ratio: 640 / 630; }
      .scene-label { top: 18px; left: 17px; font-size: .56rem; }

      .control { flex: 1; min-width: 0; padding-inline: 9px; min-height: 44px; font-size: .72rem; }

          <path d="M679 321L690 322Q701 323 695 330L683 331" fill="#557479" stroke="#47646a" stroke-width="2"/>
          <path d="M682 325L693 326" stroke="#a6b9b2" stroke-width="1.5"/>
        </g>

        <g id="breeze" fill="none" stroke="#f4efd7" stroke-width="2" stroke-linecap="round" opacity=".65"><path d="M275 271H327M290 280H317M348 269H358"/></g>
        <g id="foreground"><use href="#foreground-tile"/><use href="#foreground-tile" x="1200"/></g>
        <g id="fireflies" fill="#f2e5a0"><circle cx="850" cy="404" r="2.3"/><circle cx="277" cy="455" r="1.8"/><circle cx="986" cy="456" r="2"/></g>
        <rect width="1200" height="660" fill="url(#paper-grain)" pointer-events="none"/>
      </svg>
      <div class="speech" id="speech" aria-hidden="true">叮铃～</div>
      <figcaption class="scene-caption">晚风正好。再骑一小会儿。</figcaption>
    </figure>

    <section class="controls" aria-label="动画播放控制">
      <div class="ride-status">
        <div class="status-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="5" cy="17" r="4"/><circle cx="19" cy="17" r="4"/><path d="M5 17L10 9L14 17H5M10 9H17L19 17M10 9L9 6H6M17 9L16 5H19"/></svg></div>
        <div><p class="status-title" id="status-title">正在慢悠悠地兜风</p><div class="status-sub">已骑行 <span id="distance">0.00</span> km <span aria-hidden="true"> · </span> <span id="speed-status">12 km/h</span></div></div>
      </div>
      <div class="actions">
        <button type="button" class="control primary" id="play-toggle" aria-label="暂停动画" aria-pressed="false">
          <svg class="pause-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="2.5" height="10" rx=".8"/><rect x="9.5" y="3" width="2.5" height="10" rx=".8"/></svg>
          <svg class="play-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.7Q4 1.7 5 2.3L13 7.2Q14 8 13 8.8L5 13.7Q4 14.3 4 13.3Z"/></svg>
          <span id="play-text">暂停一下</span>
        </button>
        <button type="button" class="control" id="speed-toggle" aria-label="切换骑行速度，当前慢悠悠">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M2 11A6 6 0 1 1 14 11M8 9L11 5M4 11H12"/><circle cx="8" cy="9" r="1.2" fill="currentColor"/></svg><span id="speed-text">慢悠悠 ×1</span>
        </button>
        <button type="button" class="control" id="bell-toggle" aria-label="按一下车铃">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10H13L11.5 8V6A3.5 3.5 0 0 0 4.5 6V8ZM6.5 12Q8 14 9.5 12M8 1V2"/></svg>按个铃
        </button>
      </div>
    </section>
    <footer class="footnote">
      <div class="species"><b>夜鹭</b><span class="separator">/</span><i>Nycticorax nycticorax</i><span class="separator">·</span><span>今天不捕鱼，今天追晚风。</span></div>
      <span class="signature">HAND-DRAWN IN SVG · MADE FOR A SLOW MOMENT</span>
    </footer>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
    <noscript><p>当前显示静态插画。启用 JavaScript 后，可观看骑行动画并使用播放控制。</p></noscript>
  </main>

  <script>
    (() => {
      const get = (id) => document.getElementById(id);
      const page = document.querySelector('.page');
      const svg = get('landscape');
      const media = window.matchMedia('(max-width: 768px)');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const nodes = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'crank', 'front-pedal', 'back-pedal',
        'front-leg-outline', 'front-leg-color', 'back-leg-outline', 'back-leg-color',
        'front-toes', 'back-toes', 'rider', 'head-plumes', 'scarf-tails', 'eye',
        'cloud-track', 'far-hills', 'near-hills', 'water-track', 'road-marks',
        'foreground', 'chain', 'breeze', 'fireflies', 'bike-shadow', 'bike-bell'
      ].map((id) => [id, get(id)]));
      const speeds = [
        { scale: 1, label: '慢悠悠 ×1', name: '慢悠悠', status: '正在慢悠悠地兜风' },
        { scale: 1.5, label: '乘着风 ×1.5', name: '乘着风', status: '晚风来了，轻快一点' },
        { scale: .65, label: '看风景 ×0.65', name: '看风景', status: '骑慢一点，看看沿途的风景' }
      ];
      let playing = !reducedMotion.matches;
      let speedIndex = 0;
      let elapsed = .16;
      let lastTime = null;
      let frameId = null;
      let distance = 0;
      let displayedDistance = '';
      let bellTimer;
      let bellStart = -Infinity;
      let audioContext;

      const set = (id, name, value) => nodes[id].setAttribute(name, value);
      const moveTrack = (id, shift, period) => set(id, 'transform', `translate(${-shift % period} 0)`);
      const fitScene = () => svg.setAttribute('viewBox', media.matches ? '275 35 640 630' : '0 0 1200 660');

      function leg(side, hip, foot, bend) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const d = Math.max(1, Math.hypot(dx, dy));
        const upper = 83;
        const lower = 87;
        const along = (upper * upper - lower * lower + d * d) / (2 * d);
        const across = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = {
          x: hip.x + dx / d * along + dy / d * across * bend,
          y: hip.y + dy / d * along - dx / d * across * bend
        };
        const path = `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y - 3}`;
        set(`${side}-leg-outline`, 'd', path);
        set(`${side}-leg-color`, 'd', path);
        set(`${side}-toes`, 'd', `M${foot.x - 5} ${foot.y - 7}Q${foot.x + 4} ${foot.y - 10} ${foot.x + 12} ${foot.y - 3}M${foot.x + 2} ${foot.y - 5}L${foot.x + 17} ${foot.y - 2}`);
      }

      function render(t, now) {
        const phase = t * Math.PI * 2 / 1.65 - .4;
        const bob = Math.sin(phase * 2) * 1.4;
        const a = { x: 570 + Math.cos(phase) * 30, y: 459 + Math.sin(phase) * 30 };
        const b = { x: 570 - Math.cos(phase) * 30, y: 459 - Math.sin(phase) * 30 };
        set('rear-spokes', 'transform', `rotate(${t * 149})`);
        set('front-spokes', 'transform', `rotate(${t * 149})`);
        set('crank', 'transform', `translate(570 459) rotate(${phase * 180 / Math.PI})`);
        set('front-pedal', 'transform', `translate(${a.x} ${a.y})`);
        set('back-pedal', 'transform', `translate(${b.x} ${b.y})`);
        leg('front', { x: 515, y: 344 + bob }, a, 1);
        leg('back', { x: 495, y: 340 + bob }, b, .9);
        set('rider', 'transform', `translate(0 ${bob})`);
        set('head-plumes', 'transform', `rotate(${Math.sin(t * 3.5) * 3} 620 181)`);
        set('scarf-tails', 'transform', `rotate(${Math.sin(t * 5) * 3.5} 572 262)`);
        const blinkAt = t % 5.7;
        const eyeOpen = blinkAt > 5.43 && blinkAt < 5.58 ? .08 : 1;
        set('eye', 'transform', `translate(665 206) scale(1 ${eyeOpen})`);
        moveTrack('cloud-track', t * 5, 1200);
        moveTrack('far-hills', t * 9, 1200);
        moveTrack('near-hills', t * 20, 1200);
        moveTrack('water-track', t * 39, 400);
        moveTrack('road-marks', t * 177, 150);
        moveTrack('foreground', t * 177, 1200);
        set('chain', 'stroke-dashoffset', -t * 50);
        set('breeze', 'transform', `translate(${-t * 31 % 130} ${Math.sin(t) * 2})`);
        set('breeze', 'opacity', .3 + (Math.sin(t * 1.6) + 1) * .2);
        set('fireflies', 'opacity', .35 + (Math.sin(t * 2.2) + 1) * .28);
        set('bike-shadow', 'rx', 221 + bob * 2);
        const ringing = now - bellStart;
        set('bike-bell', 'transform', `translate(698 320) rotate(${ringing < 650 ? Math.sin(ringing / 25) * 13 * (1 - ringing / 650) : 0})`);
      }

      function frame(now) {
        frameId = null;
        const dt = lastTime === null ? 0 : Math.min((now - lastTime) / 1000, .06);
        lastTime = now;
        if (playing) {
          elapsed += dt * speeds[speedIndex].scale;
          distance += dt * 12 * speeds[speedIndex].scale / 3600;
          const value = distance.toFixed(2);
          if (value !== displayedDistance) {
            get('distance').textContent = value;
            displayedDistance = value;
          }
        }
        render(elapsed, now);
        if (playing || now - bellStart < 650) frameId = requestAnimationFrame(frame);
        else lastTime = null;
      }

      function wake() {
        if (frameId === null && !document.hidden) {
          lastTime = null;
          frameId = requestAnimationFrame(frame);
        }
      }

      function updateControls() {
        page.dataset.playing = String(playing);
        get('play-toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        get('play-toggle').setAttribute('aria-pressed', String(!playing));
        get('play-text').textContent = playing ? '暂停一下' : '继续骑行';
        get('status-title').textContent = playing ? speeds[speedIndex].status : '停一停，听听晚风';
        get('speed-text').textContent = speeds[speedIndex].label;
        get('speed-toggle').setAttribute('aria-label', `切换骑行速度，当前${speeds[speedIndex].name}`);
        get('speed-status').textContent = playing ? `${(12 * speeds[speedIndex].scale).toFixed(1).replace('.0', '')} km/h` : '休息中';
      }

      get('play-toggle').addEventListener('click', () => {
        playing = !playing;
        updateControls();
        if (playing) wake();
      });
      get('speed-toggle').addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        updateControls();
        get('announcement').textContent = `骑行速度已切换为${speeds[speedIndex].name}`;
      });

      function ringBell() {
        bellStart = performance.now();
        get('speech').classList.add('visible');
        get('announcement').textContent = '叮铃，夜鹭向你打了个招呼。';
        clearTimeout(bellTimer);
        bellTimer = setTimeout(() => get('speech').classList.remove('visible'), 1300);
        if (!reducedMotion.matches) wake();
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) return;
        try {
          audioContext ||= new Audio();
          if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
          const start = audioContext.currentTime;
          [0, .14].forEach((delay, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(index ? 1568 : 2093, start + delay);
            gain.gain.setValueAtTime(0, start + delay);
            gain.gain.linearRampToValueAtTime(.065, start + delay + .008);
            gain.gain.exponentialRampToValueAtTime(.0001, start + delay + .65);
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(start + delay);
            oscillator.stop(start + delay + .68);
          });
        } catch { /* 不支持音频时，仍保留车铃的视觉与文字反馈。 */ }
      }
      get('bell-toggle').addEventListener('click', ringBell);
      media.addEventListener('change', fitScene);
      reducedMotion.addEventListener('change', () => {
        playing = !reducedMotion.matches;
        updateControls();
        if (playing) wake();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (frameId !== null) cancelAnimationFrame(frameId);
          frameId = null;
          lastTime = null;
        } else if (playing) wake();
      });
      fitScene();
      updateControls();
      render(elapsed, performance.now());
      if (playing) wake();
    })();
  </script>
</body>
</html>
